<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poznej letiště</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <!-- Question bar -->
    <div id="question-bar" class="hidden">
      <span id="round-counter"></span>
      <span id="question-text"></span>
    </div>

    <!-- Game body: map + sidebar -->
    <div id="game-body">
      <div id="map-container">
        <svg id="map" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
          <g id="border-layer"></g>
          <g id="airport-layer"></g>
          <g id="feedback-layer"></g>
        </svg>
      </div>

      <!-- Score sidebar -->
      <button id="sidebar-toggle">Skóre ▶</button>
      <div id="sidebar" class="hidden">
        <h2>Výsledky</h2>
        <ul id="score-list"></ul>
        <div id="score-total"></div>
      </div>
    </div>

    <!-- Start screen overlay -->
    <div id="start-screen">
      <h1>Poznej letiště</h1>
      <p>Najdi 10x správné letiště na slepé mapě</p>
      <div id="options-wrapper">
        <div id="custom-checks">
          <label><input type="checkbox" value="large" checked> Velká - mezinárodní</label>
          <label><input type="checkbox" value="medium" checked> Střední - řízená</label>
          <label><input type="checkbox" value="small-north"> Malá - severní Čechy</label>
          <label><input type="checkbox" value="small-west"> Malá - západní Čechy</label>
          <label><input type="checkbox" value="small-south"> Malá - jižní Čechy</label>
          <label><input type="checkbox" value="small-east"> Malá - Morava a Slezsko</label>
          <label><input type="checkbox" value="ultralight"> Ultralehká - SLZ</label>
          <label><input type="checkbox" value="vor"> Radionavigační body - VOR</label>
          <label><input type="checkbox" value="prohibited"> Zakázané prostory - LKP</label>
          <label><input type="checkbox" value="restricted"> Omezené prostory - LKR</label>
          <label><input type="checkbox" value="tra"> Vojenské prostory - LKTRA</label>
        </div>
        <div id="modifiers">
          <label><input type="checkbox" id="browse-mode"> Objevování - zobrazit názvy</label>
          <label><input type="checkbox" id="hard-mode"> Pilotní režim - pouze ICAO kód</label>
          <label><input type="checkbox" id="infinity-mode"> VŠECHNO - ne jen 10x</label>
        </div>
      </div>
      <button class="diff-btn" id="start-btn">Hrát</button>
      <a href="#" id="reset-progress">Smazat postup</a>
    </div>

    <!-- Summary overlay -->
    <div id="summary-screen" class="hidden">
      <h1>Kolo dokončeno</h1>
      <p id="final-score"></p>
      <ul id="summary-list"></ul>
      <button id="practice-missed" class="diff-btn hidden">Procvičit chybné</button>
      <button id="play-again">Hrát znovu</button>
    </div>
  </div>

  <img id="scout-logo" src="data/LeteckySkauting_Logo.jpg" alt="Letecký Skauting">
  <div id="easter-egg" class="hidden"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
